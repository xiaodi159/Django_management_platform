{% extends 'layout.html' %}
{% block content %}
 <div class="container">
    <div class="panel panel-default">
      <div class="panel-heading">
        <h3 class="panel-title">新建用户</h3>
      </div>
      <div class="panel-body">
        <form class="form-horizontal" method="post">
          {% csrf_token %}
          <div class="form-group">
            <label class="col-sm-2 control-label">用户姓名</label>
            <div class="col-sm-10">
              <input type="text" class="form-cintrol" placeholder="name" name="name">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-2 control-label">用户密码</label>
            <div class="col-sm-10">
              <input type="text" class="form-cintrol" placeholder="password" name="password">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-2 control-label">年龄</label>
            <div class="col-sm-10">
              <input type="text" class="form-cintrol" placeholder="age" name="age">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-2 control-label">账户余额</label>
            <div class="col-sm-10">
              <input type="text" class="form-cintrol" placeholder="account" name="account">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-2 control-label">入职时间</label>
            <div class="col-sm-10">
              <input type="text" class="form-cintrol" placeholder="creat_time" name="creat_time">
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-2 control-label">性别</label>
            <div class="col-sm-10">
              <select class="form-cintrol" name="gender">
                  {% for gender in gender_choices %}
                  <option value="{{ gender.0 }}">{{ gender.1 }}</option>
                  {% endfor %}
              </select>
<!--              <input type="radio" name="sex" value="1" id="nan"> <label for="nan">男</label> -->
<!--              <input type="radio" name="sex" value="2" checked="checked" id="nv"> <label for="nv">女</label>-->
            </div>
          </div>
          <div class="form-group">
            <label class="col-sm-2 control-label">部门编号</label>
            <div class="col-sm-10">
              <select class="form-cintrol" name="depart">
                  {% for item in depart_list %}
                    <option value="{{ item.id }}">{{ item.title }}</option>
                  {% endfor %}
              </select>
            </div>
          </div>
          <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
              <button type="submit" class="btn btn-primary">保 存</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>



{% endblock %}
